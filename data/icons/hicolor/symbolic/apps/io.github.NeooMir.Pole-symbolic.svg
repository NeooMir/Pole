  <rect x="1" y="1" width="14" height="14" rx="2" fill="none" stroke="#2e3436" stroke-width="1.2"/>

  <!-- Field Internal Wall segment (Labyrinth wall) -->
  <path d="M 6 8 L 11 8 M 11 8 L 11 13" fill="none" stroke="#2e3436" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Painted cell hatching mark in bottom-left cell -->
