<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- GNOME HIG Material Gradients -->
    <!-- Board 3D front extrusion / bottom profile (depth lip) -->
    <linearGradient id="board_lip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6b3ad"/>
      <stop offset="100%" stop-color="#8f8c85"/>
    </linearGradient>

    <!-- Clean ceramic/technical drafting surface -->
    <linearGradient id="board_surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f5f4"/>
    </linearGradient>

    <!-- KuMir Cell painted gradient: vibrant spring green -->
    <linearGradient id="cell_painted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ff0a4"/>
      <stop offset="100%" stop-color="#57e389"/>
    </linearGradient>

    <!-- KuMir Diamond Robot performer (Adwaita Blue) -->
    <linearGradient id="robot_facet_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="robot_facet_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <rect x="14" y="20" width="100" height="98" rx="8" fill="url(#board_lip)"/>

  <!-- Top surface plate (100x96 with standard GNOME rx=8) -->
  <rect x="14" y="16" width="100" height="96" rx="8" fill="url(#board_surface)" stroke="#d5d3cf" stroke-width="1.5"/>

  <!-- Top specular highlight line (1px crisp Adwaita rim) -->
  <path d="M 22 17.5 L 106 17.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <g stroke="#d5d3cf" stroke-width="1.5" stroke-linecap="round">
    <!-- Vertical grid lines -->
    <line x1="39" y1="24" x2="39" y2="104"/>
    <line x1="64" y1="24" x2="64" y2="104"/>
    <line x1="89" y1="24" x2="89" y2="104"/>

    <!-- Horizontal grid lines -->
    <line x1="22" y1="44" x2="106" y2="44"/>
    <line x1="22" y1="64" x2="106" y2="64"/>
    <line x1="22" y1="84" x2="106" y2="84"/>
  </g>

  <rect x="39" y="64" width="25" height="20" fill="url(#cell_painted)" opacity="0.6"/>
  <g stroke="#26a269" stroke-width="1.8" opacity="0.75" stroke-linecap="round">
    <line x1="39" y1="74" x2="51.5" y2="64"/>
    <line x1="39" y1="84" x2="64" y2="64"/>
    <line x1="51.5" y1="84" x2="64" y2="74"/>
  </g>

  <rect x="64" y="64" width="25" height="20" fill="url(#cell_painted)" opacity="0.3"/>

  <g stroke="#000000" stroke-width="4.5" stroke-linecap="round" opacity="0.12">
    <line x1="39" y1="65" x2="89" y2="65"/>
    <line x1="89" y1="65" x2="89" y2="85"/>
  </g>
  <!-- Actual solid thick walls (Adwaita Dark 4 #241f31) -->
  <g stroke="#241f31" stroke-width="4.5" stroke-linecap="round">
    <line x1="39" y1="64" x2="89" y2="64"/>
    <line x1="89" y1="64" x2="89" y2="84"/>
  </g>
  <!-- 1px Top highlight along the wall for 3D tactile feel -->
  <line x1="41" y1="63.5" x2="87" y2="63.5" stroke="#5e5c64" stroke-width="1" stroke-linecap="round"/>

  <g>
    <polygon points="51.5,33 71,52.5 51.5,72 32,52.5" fill="#000000" opacity="0.14"/>

    <!-- Bottom 3D depth facet -->
    <polygon points="32,54 71,54 51.5,73" fill="#1a5fb4"/>

    <!-- Faceted Diamond Robot Body (KuMir Performer) -->
    <!-- Left Facet (Light illumination) -->
    <polygon points="51.5,34 32,53.5 51.5,71" fill="url(#robot_facet_left)"/>
    <!-- Right Facet (Shaded) -->
    <polygon points="51.5,34 71,53.5 51.5,71" fill="url(#robot_facet_right)"/>

    <polyline points="32,53.5 51.5,34 71,53.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Robot Central Sensor Eye / Lens -->
    <circle cx="51.5" cy="53" r="8" fill="#ffffff"/>
    <circle cx="51.5" cy="53" r="6.8" fill="#f6f5f4" stroke="#d5d3cf" stroke-width="0.8"/>
    <circle cx="51.5" cy="53" r="3.8" fill="#241f31"/>
    <!-- Camera Specular Glint -->
    <circle cx="53" cy="51.5" r="1.3" fill="#ffffff"/>
  </g>
</svg>
